name: Supabase keep-alive

# Free-tier Supabase projects pause after 7 days without database activity.
# /api/health writes one row, so calling it both keeps the project awake and
# tells us whether the database is actually answering.
#
# Daily and a write, because twice-weekly reads were most likely not enough:
# every run passed through 21 Sep 2026 and the database was unreachable by 24 Sep.
# Daily also means a failure emails every day until someone fixes it.
on:
  schedule:
    - cron: "0 6 * * *" # every day, 06:00 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the live app (touches the database)
        run: |
          body=$(mktemp)
          status=$(curl -sS -o "$body" -w "%{http_code}" --max-time 60 \
            "https://medmatchgh.vercel.app/api/health")
          echo "HTTP $status"
          cat "$body"
          echo
          if [ "$status" != "200" ]; then
            echo "::error::Health check returned $status — the Supabase project is probably paused or the service-role key is missing."
            exit 1
          fi
          # Belt and braces: a 200 whose body does not claim a reachable database
          # would mean the contract changed without this workflow noticing.
          grep -q '"db":"reachable"' "$body" || {
            echo "::error::Got 200 but the body did not report db=reachable."
            exit 1
          }
