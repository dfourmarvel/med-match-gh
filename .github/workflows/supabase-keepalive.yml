name: Supabase keep-alive

# Free-tier Supabase projects pause after ~7 days without database activity.
# This hits a route that performs a real database query so the project stays awake.
on:
  schedule:
    - cron: "0 6 * * 1,4"   # Mondays and Thursdays, 06:00 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the live app (touches the database)
        run: |
          status=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 60 "https://medmatchgh.vercel.app/api/results/00000000-0000-0000-0000-000000000000")
          echo "HTTP $status"
          # 404 is the normal answer for this route; anything else means the DB or app is unhealthy.
          [ "$status" = "404" ] || { echo "::error::Expected 404, got $status — is the Supabase project paused?"; exit 1; }
